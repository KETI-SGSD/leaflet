<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KETI 연구소기업 리플렛 펼쳐보기</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="KETI 연구소기업 리플렛">
<meta property="og:image" content="https://keti-sgsd.github.io/leaflet/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://keti-sgsd.github.io/leaflet/">
<link rel="preload" as="image" href="f3.jpg" fetchpriority="high">
<style>
  @property --k { syntax: '<number>'; inherits: true; initial-value: 1; }
  :root { --u: min(0.32vw, 0.28vh); --t: 1.1s; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: #E9EEF4; color: #1C2B3A;
         height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  header { padding: 16px 0 6px; text-align: center; }
  header h1 { font-size: 18px; font-weight: 700; }
  .mode { display: inline-flex; margin-top: 10px; padding: 3px; border-radius: 20px; background: #fff; box-shadow: 0 1px 4px rgba(20,34,63,.12); }
  .mode button { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 16px; border: 0; border-radius: 17px;
                 background: transparent; color: #1D3A5F; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mode button.on { background: #1D3A5F; color: #fff; }
  /* 펼쳐보기: 크기는 --k 배율로 직접 그려서 확대해도 흐려지지 않게 함 */
  .stage { --k: 1; --v: calc(var(--u) * var(--k)); transition: --k var(--t) ease;
           flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; perspective: 2600px; }
  .wrap { transition: transform var(--t) ease; transform-style: preserve-3d; }
  .flip { transition: transform var(--t) ease; transform-style: preserve-3d; }
  .panel { position: relative; height: calc(210 * var(--v)); transform-style: preserve-3d; }
  .B { width: calc(100 * var(--v)); }
  .A, .C { position: absolute; top: 0; height: 100%; transition: transform var(--t) ease; transform-style: preserve-3d; }
  .A { left: 100%; width: calc(97 * var(--v)); transform-origin: left center; }
  .C { right: 100%; width: calc(100 * var(--v)); transform-origin: right center; }
  .face { position: absolute; inset: 0; background-size: 100% 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden;
          box-shadow: 0 6px 22px rgba(20,34,63,.18); }
  .back { transform: rotateY(180deg); }
  .face[data-f="f3"] { background-color: #14223F; }
  .face:not([data-f="f3"]) { background-color: #fff; }
  .s0 .A, .s3 .A { transform: rotateY(-180deg) translateZ(-1px); }
  .s0 .C, .s3 .C { transform: rotateY(180deg) translateZ(-3px); }
  .s1 .A { transform: rotateY(-180deg) translateZ(-1px); }
  .s1 .C, .s2 .C, .s2 .A { transform: rotateY(0deg); }
  .s1 .wrap { transform: translateX(calc(50 * var(--v))); }
  .s2 .wrap { transform: translateX(calc(1.5 * var(--v))); }
  .s3 .flip { transform: rotateY(179.6deg); }
  @media (max-aspect-ratio: 3/4) {
    .stage.s0, .stage.s3 { --k: 2.4; }
    .stage.s1 { --k: 1.45; }
  }
  /* 한 면씩 보기 */
  .pages { display: none; flex: 1; width: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
           scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .pages::-webkit-scrollbar { display: none; }
  .pg { flex: 0 0 100%; height: 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; padding: 8px 14px; }
  .pg img { max-width: 100%; max-height: 100%; box-shadow: 0 6px 22px rgba(20,34,63,.18); background: #fff; }
  body.single .stage { display: none; }
  body.single .pages { display: flex; }
  footer { padding: 10px 0 22px; padding-bottom: max(22px, env(safe-area-inset-bottom)); text-align: center; }
  .dots { display: flex; gap: 6px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #B7CBDD; }
  .dots i.on { background: #1D3A5F; }
  /* 좌우 넘김 버튼: 화면 가장자리에 반투명으로 겹쳐 둠 */
  .side { position: fixed; top: 50%; z-index: 10; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%;
          border: 0; padding: 0; background: rgba(29,58,95,.55); color: #fff; cursor: pointer;
          display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent;
          box-shadow: 0 2px 8px rgba(20,34,63,.25); transition: opacity .25s; }
  .side svg { width: 20px; height: 20px; }
  .side:active { background: rgba(29,58,95,.8); }
  #prev { left: 10px; } #next { right: 10px; }
  body.single .side { background: rgba(29,58,95,.35); }
  .side:disabled { opacity: 0; pointer-events: none; }
  #next.hint { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  @media (min-width: 900px) { .side { width: 52px; height: 52px; margin-top: -26px; } #prev { left: 28px; } #next { right: 28px; } }
</style>
</head>
<body>
<header>
  <h1>KETI 연구소기업 리플렛 펼쳐보기</h1>
  <div class="mode"><button id="mFold" class="on" onclick="setMode(0)">펼쳐보기</button><button id="mOne" onclick="setMode(1)">한 면씩</button></div>
</header>
<div class="stage s0" id="stage" onclick="i=(i+1)%4;next.classList.remove('hint');go(0)">
  <div class="wrap">
    <div class="flip">
      <div class="panel B">
        <div class="face" data-f="f0"></div>
        <div class="face back" data-f="f1"></div>
        <div class="C">
          <div class="face" data-f="f2"></div>
          <div class="face back" data-f="f3"></div>
        </div>
        <div class="A">
          <div class="face" data-f="f4"></div>
          <div class="face back" data-f="f5"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="pages" id="pages"></div>
<button class="side" id="prev" onclick="go(-1)" aria-label="이전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="side hint" id="next" onclick="go(1)" aria-label="다음"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<footer>
  <div class="dots" id="dots"></div>
</footer>
<script>
  const IMG = { f0: 'f0.jpg', f1: 'f1.jpg', f2: 'f2.jpg', f3: 'f3.jpg', f4: 'f4.jpg', f5: 'f5.jpg' };
  const ORDER = ['f3', 'f5', 'f2', 'f0', 'f4', 'f1'];  // 표지, 날개, 안쪽 1·2·3면, 뒷면
  // 표지를 먼저 받아 띄우고, 나머지 면은 표지가 뜬 뒤에 받음
  const setFace = e => e.style.backgroundImage = 'url(' + IMG[e.dataset.f] + ')';
  const coverFace = document.querySelector('.face[data-f="f3"]');
  const rest = () => document.querySelectorAll('.face').forEach(e => { if (e !== coverFace) setFace(e); });
  const ci = new Image(); ci.onload = ci.onerror = () => { setFace(coverFace); rest(); }; ci.src = IMG.f3;
  ORDER.forEach((f, k) => { const d = document.createElement('div'); d.className = 'pg'; const im = new Image(); if (k) im.loading = 'lazy'; im.src = IMG[f]; im.alt = ''; d.appendChild(im); pages.appendChild(d); });

  let mode = 0, i = 0, p = 0;
  const steps = () => mode ? ORDER.length : 4;
  function paint() {
    const n = steps(), k = mode ? p : i;
    prev.disabled = k === 0; next.disabled = k === n - 1;
    if (dots.children.length !== n) dots.innerHTML = '<i></i>'.repeat(n);
    [...dots.children].forEach((e, j) => e.className = j === k ? 'on' : '');
  }
  function go(d) {
    if (d) next.classList.remove('hint');
    if (mode) { p = Math.max(0, Math.min(ORDER.length - 1, p + d)); pages.scrollTo({ left: p * pages.clientWidth, behavior: d ? 'smooth' : 'auto' }); }
    else { i = Math.max(0, Math.min(3, i + d)); stage.className = 'stage s' + i; }
    paint();
  }
  function setMode(m) {
    mode = m; document.body.classList.toggle('single', !!m);
    mFold.classList.toggle('on', !m); mOne.classList.toggle('on', !!m);
    go(0);
  }
  pages.addEventListener('scroll', () => { const k = Math.round(pages.scrollLeft / pages.clientWidth); if (k !== p) { p = k; next.classList.remove('hint'); paint(); } }, { passive: true });
  window.addEventListener('resize', () => { if (mode) pages.scrollLeft = p * pages.clientWidth; });

  let sx = null;
  stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 40) { e.preventDefault(); go(dx < 0 ? 1 : -1); } });
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
  const h = location.hash.slice(1);
  if (h[0] === 'p') { p = +h.slice(1) || 0; setMode(1); } else { i = +h || 0; go(0); }
</script>
</body>
</html>
